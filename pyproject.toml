[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `claude-top` on PyPI is an unrelated project; the command this installs is still `claude-top`
name = "claude-agents-top"
dynamic = ["version"]
description = "A top-style live view of your Claude Code background sessions and plan usage"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "top", "tui", "monitor"]
classifiers = [
  "Environment :: Console :: Curses",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/jachai/claude-top"
Issues = "https://github.com/jachai/claude-top/issues"
Changelog = "https://github.com/jachai/claude-top/blob/main/CHANGELOG.md"

[project.scripts]
claude-top = "claude_top:main"

[tool.setuptools]
py-modules = ["claude_top"]

[tool.setuptools.dynamic]
version = { attr = "claude_top.__version__" }
