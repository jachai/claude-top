[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-top"
version = "0.1.0"
description = "A top-style live view of your Claude Code background sessions and plan usage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
claude-top = "claude_top:main"

[tool.setuptools]
py-modules = ["claude_top"]
