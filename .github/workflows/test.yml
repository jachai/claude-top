name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same matrix first

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep the full Python matrix on Linux and one macOS platform leg. uv ships
        # its own Python builds, so 3.9 keeps working after runner images drop it.
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv run --no-project --python ${{ matrix.python }} python claude_top.py --once   # empty config dir
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-top-empty
          CLAUDE_TOP_LIVE: "0"
