name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python claude_top.py --once   # runs against an empty config dir
        env:
          CLAUDE_CONFIG_DIR: /tmp/claude-top-empty
          CLAUDE_TOP_LIVE: "0"
